    abstract_admin: "This guide covers system administration tasks like maintaining, monitoring and customizing an initially installed system."
    abstract_autoyast: "AutoYaST is a system for unattended mass deployment of SUSE Linux Enterprise Server systems. It uses an AutoYaST profile that contains installation and configuration data. The book guides you through the basic steps of auto-installation: preparation, installation, and configuration."
    abstract_deployment: "This guide details how to install single or multiple systems, and how to exploit the product-inherent capabilities for a deployment infrastructure."
    abstract_gnomeuser: "This guide introduces the GNOME desktop of SUSE Linux Enterprise Server."
    abstract_installquick: "This Quick Start guides you step by step through the installation of SUSE® Linux Enterprise Server 15 SP7."
    abstract_modulesquick: "This Quick Start gives you an overview of the modules and extensions available for the SUSE Linux Enterprise family. Learn about their purpose and features, and how to manage them."
    abstract_osuse_startup: "This manual will see you through your initial contact with SUSE® Linux Enterprise Server. Learn how to install, use and enjoy your system."
    abstract_smt: "An administrator's guide to Repository Mirroring Tool—a proxy system for SUSE Customer Center with repository and registration targets."
    abstract_storage: "This guide provides information about how to manage storage devices on a SUSE Linux Enterprise Server."
    abstract_tuning: "This guide supports administrators in problem detection, resolution and optimization."
    abstract_upgrade: "This book guides you through upgrades of SUSE Linux Enterprise Server. If you use SUSE Linux Enterprise Server as base system for other SLE products or extensions, also see their product documentation for upgrade information specific to this product or extension."
    abstract_virtualization: "This guide describes virtualization technology in general. It introduces libvirt—the unified interface to virtualization—and provides detailed information on specific hypervisors."
